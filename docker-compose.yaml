name: firecrawl

x-common-service: &common-service
  # NOTE: If you don't want to build the service locally,
  # comment out the build: statement and uncomment the image: statement
  # image: ghcr.io/firecrawl/firecrawl
  build: apps/api

  # Pass every key from the repo-root .env into the container, instead of
  # relying only on the x-common-env allowlist below. Without this, adding a
  # setting to apps/api/src/config.ts and .env silently does nothing unless it
  # is also listed in x-common-env — the failure mode that left TYPESAFE_*,
  # MAX_RAM and MAX_CPU unset inside the container. Entries in `environment:`
  # still win, so container-internal values (NUQ_RABBITMQ_URL, POSTGRES_HOST,
  # ...) are unaffected. `required: false` keeps `docker compose config` working
  # on a checkout that has no .env yet.
  env_file:
    - path: .env
      required: false

  restart: unless-stopped
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  # Defaulted, unlike most entries here: this one is z.stringbool().optional()
  # and zod rejects "", so forwarding an empty value would fail configSchema.parse
  # and stop the container booting. "false" also keeps local LLM thinking enabled
  # -- enable_thinking=false stalls requests on the Swift/Qwen3.8 template.
  LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-false}
  LLM_SLOT_ID: ${LLM_SLOT_ID:-}
  LLM_LOCK_FILE: ${LLM_LOCK_FILE:-}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  # TypeSafe Jev: the /search safe filter, and branding when BRANDING_JEV* selects
  # the team. TYPESAFE_BASE_URL is the API root (the SDK appends /v1/systemone);
  # TYPESAFE_MODEL overrides TypeSafe's "jev-latest", e.g. "jev-1.13-free" on Zen.
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-}
  TYPESAFE_MODEL: ${TYPESAFE_MODEL:-}
  TYPESAFE_INPUT_USD_PER_MTOK: ${TYPESAFE_INPUT_USD_PER_MTOK:-}
  BRANDING_JEV: ${BRANDING_JEV:-}
  BRANDING_JEV_ROLLOUT_PERCENT: ${BRANDING_JEV_ROLLOUT_PERCENT:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  # Worker admission control (services/system-monitor.ts): a worker takes a new
  # job only while cpuUsage < MAX_CPU && memoryUsage < MAX_RAM. Usage is measured
  # HOST-wide (systeminformation), not against the container's cgroup limit, so a
  # co-resident llama-swap holding tens of GB of model weights can push the host
  # past 0.8 and stall every worker. Raise these on a box shared with an LLM.
  MAX_CPU: ${MAX_CPU:-0.95}
  MAX_RAM: ${MAX_RAM:-0.95}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  # Set NUQ_BACKEND=fdb to run the queue on FoundationDB instead of Postgres.
  # The foundationdb/foundationdb-init services were removed from this fork (unused:
  # NUQ_BACKEND is unset, so nuq-postgres is the active backend). Re-add them, plus
  # the fdb-data/fdb-cluster-file volumes and the api's /var/fdb mount, to use fdb.
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}

services:
  playwright-service:
    # NOTE: If you don't want to build the service locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/playwright-service:latest
    build: apps/playwright-service-ts
    restart: unless-stopped
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      # Configure maximum concurrent pages for Playwright browser instances
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Resource limits for Docker Compose (not Swarm)
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  api:
    <<: *common-service
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # Only the pg backend uses nuq-postgres, so an unhealthy Postgres must not
      # block startup when NUQ_BACKEND=fdb.
      nuq-postgres:
        condition: service_healthy
        required: false
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    volumes:
      # Host dir for llm.lock (LLM_LOCK_FILE); a directory, so the file can come and go.
      - /opt/llm/lock:/llm-lock:ro
    command: node dist/src/harness.js --start-docker
    # Resource limits for Docker Compose (not Swarm)
    # Increase if you have more CPU cores/RAM available
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G

  searxng:
    # Search provider for /v2/search. Firecrawl's chain is fire-engine ->
    # searxng -> DuckDuckGo (src/search/v2/index.ts), so this only has to
    # return results; anything it misses still falls through to DuckDuckGo.
    # No published port on purpose: an open SearXNG on the LAN is an open proxy.
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - backend
    volumes:
      # The settings.yml here is what enables `formats: [html, json]`; without
      # it Firecrawl gets 200 responses carrying no results array.
      - ./searxng:/etc/searxng:rw
    environment:
      # The image entrypoint maps SEARXNG_PORT -> GRANIAN_PORT, and granian is
      # what actually binds. settings.yml's `server.port` is ignored here, so
      # this is the value that has to be right.
      - SEARXNG_PORT=9003
      # Only used to build absolute result links; keep the port in step with
      # SEARXNG_PORT above.
      - SEARXNG_BASE_URL=http://localhost:9003/

  redis:
    # NOTE: If you want to use Valkey (open source) instead of Redis (source available),
    # uncomment the Valkey statement and comment out the Redis statement.
    # Using Valkey with Firecrawl is untested and not guaranteed to work. Use with caution.
    image: redis:alpine
    # image: valkey/valkey:alpine

    restart: unless-stopped
    networks:
      - backend
    command: redis-server --bind 0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    networks:
      - backend
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  nuq-postgres:
    # NOTE: If you don't want to build the image locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/nuq-postgres:latest
    build: apps/nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  backend:
    driver: bridge
