# agnix — the linter IntelliJ's plugin runs over this repository's agent configs.
#
# RUNTIME, not a rule switch. skills/firecrawl/SKILL.md declares itself manual-only with
# `metadata.hermes.requires_tools`, and the universal Agent Skills spec says `metadata` is a
# flat string→string map. Under the default (generic) target that is an AS-016 error (HIGH,
# MUST, "Skill Parse Error") on the skill; declaring claude-code accepts the nested form and
# the finding disappears.
#
# So it is not silenced — it is validated against the runtime that actually loads this skill,
# which is also the runtime whose plugin reports it in the IDE. Measured with agnix 0.57.0:
# no config = 1 error on the skill, tools = ["claude-code"] = 0.
#
# `tools`, NOT `target`. `target = "ClaudeCode"` looks equivalent and does nothing: agnix
# deprecated that field ("Field 'target' is deprecated") and ignores it without warning, so a
# config carrying only it validates exactly as if no config existed. That is why
# .github/scripts/skill-validate.test.mjs proves the repo clean by a deliberate break rather
# than by trusting a key's presence.
tools = ["claude-code"]

# Warning is the floor: an ERROR is a file that will not load. What is left here are warnings in
# the root AGENTS.md/DESIGN.md — instruction-layer precedence, "lost in the middle" keyword
# placement, hard-coded ~/.agents paths — upstream prose this fork does not own or a documented
# convention of the project. None of them is a config file that fails to load.
severity = "Warning"

# apps/ is product and fixture code, not agent configuration: blog content, load-test output,
# and a pasted pytest traceback (apps/python-sdk/firecrawl/TODO.md) whose `response =
# <Response [500]>` line XML-001 reads as an unclosed tag — the only ERROR in the repository.
# Measured with agnix 0.57.0: the tree supplies 22 of the 28 files agnix opens. Every agent
# config this repository ships is at the root or under skills/.
exclude = ["apps/**"]

[rules]
# Nothing is disabled. The one rule that fires on the skill (AS-016) is answered by the runtime
# above, and a disabled rule here would be a second way to hide it — one a reader has to notice
# is gone.
