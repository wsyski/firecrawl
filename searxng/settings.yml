# SearXNG settings for the local Firecrawl stack.
#
# Firecrawl's searxng provider (apps/api/src/search/v2/searxng.ts) does
#   GET {SEARXNG_ENDPOINT}/search?q=...&format=json
# so the JSON format MUST be enabled here. SearXNG ships with only `html`,
# which is why a misconfigured instance returns 200 and zero results - the
# response parses fine, it just has no .results array.
use_default_settings: true

general:
  instance_name: "local firecrawl"
  debug: false

server:
  # Bind on all interfaces so the api container can reach it over the compose
  # network. Do NOT publish this port to the host: an open SearXNG on a LAN is
  # an open proxy.
  bind_address: "0.0.0.0"
  port: 3003
  secret_key: "local-compose-only-change-me-if-exposed"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 20
  pool_maxsize: 10

# Engines probed from this egress IP on 2026-10-10 (q=..., engines=<one>):
# answering: yahoo, "duckduckgo web", mwmbl. Blocked: duckduckgo (CAPTCHA), brave and
# google cse (429, 180 s suspensions that slow every query), google ("access denied"),
# qwant (CAPTCHA), bing (connection error), yep. Re-probe before re-enabling one:
#   curl -G .../search --data-urlencode q=test --data-urlencode engines=<name> \
#     --data-urlencode format=json | jq '.results|length, .unresponsive_engines'
engines:
  - name: yahoo
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: mwmbl
    disabled: false
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: google cse
    disabled: true
  # Developer (it/packages/repos): off by default upstream, answering here.
  # github, stackoverflow, askubuntu, superuser, mdn, pypi, docker hub are on by default.
  - name: npm
    disabled: false
  - name: pkg.go.dev
    disabled: false
  - name: lib.rs
    disabled: false
  - name: huggingface
    disabled: false
  - name: hackernews
    disabled: false
  # News: duckduckgo news, wikinews (default on) and qwant news answer. google news
  # ("access denied"), reuters (HTTP error), bing news (connection error, as bing) and
  # brave.news (crash) do not.
  - name: qwant news
    disabled: false
  - name: google news
    disabled: true
  - name: reuters
    disabled: true
  - name: bing news
    disabled: true
  - name: brave.news
    disabled: true
